<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정보 탐정단 수업 앱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 초등학생의 탐정 수첩. 점선 공책 위에 견출지, 마스킹 테이프, 붙임쪽지, 칭찬 도장이 놓이고
   돋보기 탐정 「보기」가 말풍선으로 안내한다. 차시마다 색연필 색이 하나씩 정해져 있다. 밝은 한 가지 테마만 쓴다. */
:root{
  color-scheme:light;
  --paper:#FFF8E8; --white:#FFFFFF; --ink:#3A2F4B; --muted:#756A88; --line:#E9DFC9;
  --sky:#C6E7FF; --sky-d:#3F9BDD; --peach:#FFD6C9; --peach-d:#F26B4E; --lemon:#FFE98A; --lemon-d:#E5A800;
  --mint:#C8F1DC; --mint-d:#1F9E6C; --lav:#E1D8FF; --lav-d:#7C62DB; --red:#EE4B48;
  --c:var(--lemon); --cd:var(--lemon-d);
  --display:'Jua','Gowun Dodum',sans-serif; --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif; --hand:'Gaegu','Gowun Dodum',cursive;
}
.t1{--c:var(--sky);--cd:var(--sky-d)} .t2{--c:var(--peach);--cd:var(--peach-d)} .t3{--c:var(--lemon);--cd:var(--lemon-d)}
.t4{--c:var(--mint);--cd:var(--mint-d)} .t5{--c:var(--lav);--cd:var(--lav-d)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);background-image:radial-gradient(var(--line) 1.6px,transparent 1.7px);background-size:24px 24px;
  color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.7;word-break:keep-all}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.3;margin:0;text-wrap:balance}
h1{font-size:34px} h2{font-size:25px} h3{font-size:20px}
p{margin:0} b{font-weight:700}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--lav-d);outline-offset:3px}
svg{flex:none}

/* 머리: 수첩 색인 탭 */
.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:3px solid var(--ink)}
.top-in{max-width:940px;margin:0 auto;padding:10px 16px 6px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:26px;color:var(--ink);text-decoration:none;margin-right:auto}
.brand i{font-style:normal;color:var(--peach-d)}
.who{font-family:var(--hand);font-weight:700;font-size:19px;background:var(--white);border:2.5px solid var(--ink);border-radius:10px;padding:0 12px}
.who:empty{display:none}
.tlink{font-family:var(--display);font-size:16px;text-decoration:none;color:var(--ink);background:var(--lav);border:2.5px solid var(--ink);border-radius:999px;padding:3px 14px}
.tabs{max-width:940px;margin:0 auto;padding:0 16px;display:flex;gap:6px;overflow-x:auto;align-items:flex-end}
.tab{flex:0 0 auto;display:flex;gap:6px;align-items:center;font-family:var(--display);font-size:17px;color:var(--ink);text-decoration:none;
  background:var(--tc,var(--white));border:2.5px solid var(--ink);border-bottom:0;border-radius:14px 14px 0 0;padding:4px 16px 3px;opacity:.72}
.tab[aria-current="page"]{opacity:1;padding:9px 18px 6px;font-size:19px}

main{max-width:940px;margin:0 auto;padding:26px 16px 90px;display:flex;flex-direction:column;gap:24px}
.card{position:relative;background:var(--white);border:3px solid var(--ink);border-radius:26px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 7px 0 var(--c)}
.card.tape::before{content:"";position:absolute;top:-13px;left:50%;width:110px;height:24px;margin-left:-55px;transform:rotate(-2deg);
  background:repeating-linear-gradient(45deg,var(--c) 0 8px,var(--white) 8px 12px);opacity:.92;border-left:2px dotted var(--white);border-right:2px dotted var(--white)}
.muted{color:var(--muted);font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.hl{background:linear-gradient(transparent 52%,var(--lemon) 52%);padding:0 3px}

/* 견출지와 순서 딱지 */
.sec{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.step{font-family:var(--display);font-size:19px;min-width:38px;height:38px;padding:0 8px;border-radius:999px;background:var(--cd);color:var(--white);display:inline-flex;align-items:center;justify-content:center;border:2.5px solid var(--ink)}
.label{font-family:var(--hand);font-weight:700;font-size:17px;line-height:1.3;background:var(--white);border:2px solid #4A7FDB;outline:1.5px solid #4A7FDB;outline-offset:-6px;border-radius:6px;padding:6px 16px;color:#2F5FB5}
.demo{font-family:var(--hand);font-size:15px;font-weight:700;border:2px dashed var(--muted);color:var(--muted);border-radius:8px;padding:0 8px;vertical-align:middle}

/* 버튼과 고르기 딱지 */
.btn{font-family:var(--display);font-size:18px;border:3px solid var(--ink);background:var(--lemon);color:var(--ink);border-radius:16px;padding:8px 20px;cursor:pointer;box-shadow:0 5px 0 var(--ink);text-decoration:none;display:inline-block;align-self:flex-start}
.btn.ghost{background:var(--white)}
.btn.small{font-size:16px;padding:4px 14px;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.chip{font-family:var(--display);font-size:17px;border:2.5px solid var(--ink);background:var(--white);border-radius:999px;padding:5px 16px;cursor:pointer;box-shadow:0 4px 0 var(--line)}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.chip[aria-pressed="true"]{background:var(--c);box-shadow:0 4px 0 var(--cd)}
.chip.right{border-color:var(--mint-d);box-shadow:0 4px 0 var(--mint-d)} .chip.right::after{content:" ✓";color:var(--mint-d)}
.chip.wrong{border-style:dashed;border-color:var(--red);box-shadow:none}
input[type=text],input[type=password],textarea{width:100%;font-family:var(--hand);font-size:22px;line-height:1.5;border:2.5px solid var(--ink);border-radius:16px;padding:8px 14px;background:#FFFDF6}
input::placeholder,textarea::placeholder{color:#B5AAC4}
textarea{min-height:88px;resize:vertical;background-image:repeating-linear-gradient(transparent 0 32px,var(--line) 32px 33px);background-position:0 8px;line-height:33px}
label.f{display:flex;flex-direction:column;gap:6px;font-family:var(--display);font-size:18px}
label.f .h{font-family:var(--body);font-size:15px;color:var(--muted)}

/* 돋보기 탐정 보기와 말풍선 */
.say{display:flex;gap:12px;align-items:flex-end}
.bubble{position:relative;background:var(--white);border:2.5px solid var(--ink);border-radius:20px;padding:10px 16px;font-size:17px;line-height:1.55}
.bubble::before{content:"";position:absolute;left:-11px;bottom:16px;width:18px;height:18px;background:inherit;border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg)}
.say.good .bubble{background:var(--mint)} .say.oops .bubble{background:var(--peach)}
@media (prefers-reduced-motion:no-preference){
  .masc{animation:bob 2.8s ease-in-out infinite} @keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}
  .stamp{animation:thud .35s cubic-bezier(.2,1.6,.4,1)} @keyframes thud{from{transform:rotate(-8deg) scale(1.9);opacity:0}}
  .mcard .card{transition:transform .15s} .fill{transition:width .5s}
}

/* 사건 표지 */
.banner{background:var(--c);border:3px solid var(--ink);border-radius:30px;padding:24px;display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:end;box-shadow:0 7px 0 var(--cd)}
.banner-txt{display:flex;flex-direction:column;gap:10px}
.file{font-family:var(--display);font-size:17px;background:var(--ink);color:var(--white);border-radius:999px;padding:1px 14px;align-self:flex-start}
.goal{background:var(--white);border:2.5px dashed var(--ink);border-radius:16px;padding:10px 14px;font-size:17px}
.goal b{font-family:var(--display);font-weight:400;display:block;color:var(--cd)}
@media (max-width:640px){.banner{grid-template-columns:1fr} h1{font-size:28px}}

/* 화면 속 정보(게시물, 문자, 영상) */
.phone{background:var(--paper);border:2.5px solid var(--ink);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px}
.sns-h{display:flex;gap:10px;align-items:center}
.sns-h div{display:flex;flex-direction:column;line-height:1.35}
.av{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-size:20px;background:var(--line);flex:none}
.meta{font-size:14.5px;color:var(--muted)}
.big{font-size:19px;font-weight:700;line-height:1.5}
.photo{align-self:flex-start;display:flex;gap:8px;align-items:center;background:var(--white);border:2px solid var(--ink);border-radius:12px;padding:6px 12px;font-size:15px}
.msg{align-self:flex-start;background:var(--lemon);border:2.5px solid var(--ink);border-radius:18px 18px 18px 4px;padding:8px 14px;font-weight:700;max-width:520px}
.video{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.thumb{position:relative;width:170px;height:100px;border:2.5px solid var(--ink);border-radius:14px;background:linear-gradient(#BFE9A8 55%,#8CCB6B 55%);flex:none}
.thumb::before{content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:var(--white);border:2.5px solid var(--ink)}
.thumb::after{content:"";position:absolute;left:50%;top:50%;margin:-9px 0 0 -5px;border:9px solid transparent;border-left:14px solid var(--ink)}
.thumb span{position:absolute;right:6px;bottom:5px;font-size:12px;background:var(--ink);color:var(--white);border-radius:5px;padding:0 5px;line-height:1.5}
.found{font-family:var(--hand);font-size:20px;font-weight:700;line-height:1.45;background:var(--lemon);padding:10px 16px;transform:rotate(-.6deg);box-shadow:3px 4px 0 rgba(58,47,75,.18)}
.check{display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-bottom:2px dotted var(--line);padding-bottom:10px}
.check>span{flex:1 1 240px}

/* 칭찬 도장 */
.stamp{width:82px;height:82px;border-radius:50%;border:3.5px solid var(--red);outline:2px solid var(--red);outline-offset:-9px;color:var(--red);display:inline-flex;align-items:center;justify-content:center;text-align:center;font-family:var(--display);font-size:17px;line-height:1.15;transform:rotate(-8deg);flex:none}
.stamp.ok{border-color:var(--mint-d);outline-color:var(--mint-d);color:var(--mint-d)}
.stamp.mini{width:58px;height:58px;font-size:14px;outline-offset:-7px}

/* 막대 그래프 */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(64px,36%) 1fr 50px;gap:10px;align-items:center;font-size:16px}
.track{height:24px;background:var(--paper);border-radius:999px;overflow:hidden;border:2.5px solid var(--ink)}
.fill{display:block;height:100%;border-radius:0 999px 999px 0;background:repeating-linear-gradient(-45deg,var(--cd) 0 10px,var(--c) 10px 16px);border-right:2.5px solid var(--ink)}
.bar.me .fill{background:repeating-linear-gradient(-45deg,var(--red) 0 10px,var(--peach) 10px 16px)}
.bar .n{font-family:var(--display);font-variant-numeric:tabular-nums;text-align:right}

/* 읽기 공책 */
.read{background:#FFFDF6;border:2.5px solid var(--ink);border-radius:18px;padding:16px 20px 6px 46px;font-size:20px;line-height:44px;
  background-image:linear-gradient(90deg,transparent 31px,var(--peach) 31px 33px,transparent 33px),repeating-linear-gradient(transparent 0 43px,var(--sky) 43px 44px);background-position:0 0,0 14px}
.read p{margin-bottom:0}
.read .w{cursor:pointer;border-radius:6px;padding:2px 1px}
.read .w.on{background:var(--lemon);box-shadow:0 0 0 2px var(--lemon)}
.read .s.pick{text-decoration:underline wavy var(--red);text-decoration-thickness:2.5px;text-underline-offset:7px}
.read.sent .s{cursor:pointer}
.pn{font-family:var(--display);font-size:16px;color:var(--white);background:var(--cd);border-radius:999px;padding:2px 10px;margin-right:8px}

/* 붙임쪽지 게시판 */
.notes{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));padding-top:8px}
.note{position:relative;padding:22px 16px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:4px 6px 0 rgba(58,47,75,.16);background:var(--lemon)}
.note::before{content:"";position:absolute;top:-10px;left:50%;margin-left:-34px;width:68px;height:20px;background:rgba(255,255,255,.75);border:1.5px dashed rgba(58,47,75,.25);transform:rotate(-3deg)}
.note:nth-child(odd){transform:rotate(-.8deg)} .note:nth-child(even){transform:rotate(.7deg)}
.note.n1{background:var(--sky)} .note.n2{background:var(--peach)} .note.n3{background:var(--lemon)} .note.n4{background:var(--mint)}
.note .qq{font-family:var(--hand);font-weight:700;font-size:23px;line-height:1.35}
.note .by{font-size:14px}
.note input[type=text]{font-size:19px;padding:4px 10px;border-width:2px}
.ans{font-family:var(--hand);font-size:19px;line-height:1.4;background:rgba(255,255,255,.7);border-radius:10px;padding:4px 10px}
.kind{font-family:var(--display);font-size:14px;background:var(--white);border:2px solid var(--ink);border-radius:999px;padding:0 10px;align-self:flex-start}

/* 첫 화면 */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:center}
.hero h1{font-size:38px}
@media (max-width:640px){.hero{grid-template-columns:1fr}.hero h1{font-size:30px}}
.badge-tag{background:var(--white);border:3px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:0 7px 0 var(--lav)}
.badge-tag header{background:var(--lav-d);color:var(--white);font-family:var(--display);font-size:20px;text-align:center;padding:14px 10px 6px;position:relative}
.badge-tag header::before{content:"";position:absolute;top:5px;left:50%;margin-left:-16px;width:32px;height:8px;border-radius:999px;background:var(--paper);border:2px solid var(--ink)}
.badge-tag .in{padding:14px 18px 18px;display:grid;gap:12px;grid-template-columns:110px 1fr}
@media (max-width:480px){.badge-tag .in{grid-template-columns:1fr}}
.slots{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.slot{width:84px;height:84px;border-radius:50%;border:3px dashed var(--muted);display:flex;align-items:center;justify-content:center;font-family:var(--display);color:var(--muted);font-size:15px;background:var(--white)}
.slot.got{border:3px solid var(--ink);background:var(--sc);box-shadow:0 5px 0 var(--ink);transform:rotate(-6deg)}
.mcard{text-decoration:none;color:inherit}
.mcard .card{height:100%;background:var(--c);box-shadow:0 7px 0 var(--cd);gap:8px}
.mcard:hover .card{transform:translateY(-4px) rotate(-1deg)}
.mcard .ic{align-self:flex-end;margin-top:-6px}
.mcard .page{font-family:var(--hand);font-weight:700;background:var(--white);border:2px solid var(--ink);border-radius:999px;padding:0 12px;font-size:17px}

/* 다짐 상장 */
.pledge{position:relative;border:3px solid var(--ink);border-radius:18px;padding:26px 24px 20px;background:#FFFDF6;outline:3px dotted var(--lemon-d);outline-offset:-12px;text-align:center}
.pledge h3{font-size:26px;margin-bottom:8px}
.pledge p{font-family:var(--hand);font-size:24px;line-height:1.5}
.pledge .sig{font-size:19px;color:var(--muted);margin-top:8px}
.pledge .stamp{position:absolute;right:18px;bottom:14px}

/* 선생님 화면 */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:12px}
.tile{background:var(--paper);border:2.5px solid var(--ink);border-radius:18px;padding:10px 14px;font-size:15px}
.tile b{font-family:var(--display);font-weight:400;font-size:34px;display:block;line-height:1.2;font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-size:16px}
th{font-family:var(--display);font-weight:400;background:var(--c)}
th,td{border-bottom:2px dotted var(--line);padding:8px 10px;text-align:left}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;border:2.5px solid var(--ink);border-radius:16px}
.tag{font-family:var(--display);font-size:14px;border:2px solid var(--ink);border-radius:999px;padding:0 10px;background:var(--white);white-space:nowrap}
.tag.new{background:var(--lemon)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:9}

/* 연결 모드 */
.demo.live{border-style:solid;border-color:var(--mint-d);color:var(--mint-d);background:var(--white)}
.net{font-family:var(--display);font-size:14px;border-radius:999px;padding:1px 12px;border:2px solid var(--ink);background:var(--white)}
.net:empty{display:none}
.net.saving{background:var(--lemon)} .net.ok{background:var(--mint)} .net.off{background:var(--peach)}
.badge-tag .wide{grid-column:1/-1}
.entry{font-size:16px;line-height:1.45}
.entry.ok{color:var(--mint-d)} .entry.bad{color:var(--red)}
.slot.prog{font-size:14px;line-height:1.3;text-align:center}
.qr{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.qr .code{width:220px;max-width:100%;aspect-ratio:1;background:var(--white);border:3px solid var(--ink);border-radius:18px;padding:10px;flex:none}
.qr .code svg{width:100%;height:100%;display:block}
.qr .url{font-family:var(--display);font-size:18px;word-break:break-all;flex:1 1 220px;min-width:0}
.big-code{font-family:var(--display);font-size:44px;line-height:1.1;letter-spacing:2px}
.advice{background:var(--paper);border:2.5px dashed var(--ink);border-radius:14px;padding:8px 12px;font-size:15.5px;line-height:1.55}
.reasons{display:flex;flex-direction:column;gap:6px;font-size:15.5px}
.reasons p{font-family:var(--hand);font-size:19px;line-height:1.4;background:var(--paper);border-radius:10px;padding:2px 10px}
td .dot{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);vertical-align:middle}
td .dot.on{background:var(--mint-d)}

/* 질문 수사판: 탐정 수사판(크라프트지) 위에 질문 쪽지를 압정으로 꽂고 끈으로 잇는다 */
main.wide{max-width:1500px}
body.present .top{display:none}
body.present main{padding-top:18px}
.present-bar{display:flex;flex-direction:column;gap:14px}
.present-bar h1{margin-top:6px}
.fsteps{gap:8px}
.fdot{font-family:var(--display);font-size:16px;color:var(--ink);border:2.5px solid var(--ink);background:var(--white);border-radius:999px;padding:3px 14px 3px 4px;display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.fdot b{font-weight:400;width:26px;height:26px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);display:inline-flex;align-items:center;justify-content:center}
.fdot.done b{background:var(--lav-d);color:var(--white)}
.fdot.now{background:var(--lav)}
@media (max-width:760px){.fdot{padding-right:4px}.fdot span{display:none}}
.btn[disabled]{opacity:.4;cursor:default;transform:none;box-shadow:0 5px 0 var(--ink)}
.flow-wrap{position:relative;container-type:inline-size;border:3px solid var(--ink);border-radius:26px;padding:24px 20px 28px 52px;
  background-color:#F7E9CC;background-image:radial-gradient(rgba(120,80,30,.14) 1.2px,transparent 1.5px),radial-gradient(rgba(120,80,30,.08) 1px,transparent 1.3px);
  background-size:22px 22px,13px 13px;background-position:0 0,7px 9px;box-shadow:inset 0 0 0 6px rgba(255,255,255,.35)}
.flow-svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:0}
.flow-cols{position:relative;z-index:1;display:grid;grid-template-columns:minmax(130px,1fr) minmax(250px,2.3fr) minmax(130px,1fr) minmax(120px,.8fr);gap:30px;align-items:start}
.fcol{display:flex;flex-direction:column;gap:18px;min-width:0}
.fcol-big{align-self:stretch}
.fcol-big .bigq{margin:auto 0}
.fhead{display:flex;gap:8px;align-items:center;min-width:0}
.fhead .fstep{font-family:var(--display);width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--white);display:inline-flex;align-items:center;justify-content:center;flex:none}
.fhead b{display:block;font-family:var(--display);font-weight:400;font-size:19px;line-height:1.2}
.fhead small{display:block;font-size:13px;color:var(--muted);line-height:1.3}
.fhead2,.lane{display:grid;grid-template-columns:minmax(104px,.42fr) 1fr;gap:24px;align-items:center}
.lane-notes{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;min-width:0}
.lane-notes .fnote{flex:1 1 150px;max-width:240px}
.fnode{font:inherit;color:var(--ink);text-align:left;cursor:pointer;margin:0}
.fnote{position:relative;display:flex;flex-direction:column;gap:5px;padding:16px 12px 10px;background:var(--white);border:2px solid rgba(58,47,75,.6);border-radius:4px;box-shadow:3px 5px 0 rgba(58,47,75,.16);min-width:0}
.fnote::before{content:"";position:absolute;top:-8px;left:50%;margin-left:-7px;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FF9C94,#D93A33 62%);border:1.5px solid var(--ink)}
.fstack{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px 16px;align-items:start}
.fstack .fnote:nth-child(odd),.lane-notes .fnote:nth-child(odd){transform:rotate(-.7deg)}
.fstack .fnote:nth-child(even),.lane-notes .fnote:nth-child(even){transform:rotate(.6deg)}
.flow-fit{position:relative}
.k-n1{background:var(--sky)} .k-n2{background:var(--peach)} .k-t{background:var(--lemon)} .k-n4{background:var(--mint)}
.fq{font-family:var(--hand);font-weight:700;font-size:18px;line-height:1.3;overflow-wrap:anywhere}
.fby{font-size:13px;color:var(--muted);line-height:1.35}
.ftag{align-self:flex-start;font-family:var(--display);font-size:12.5px;line-height:1.5;background:var(--white);border:1.5px solid var(--ink);border-radius:999px;padding:0 8px}
.fmeta{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--display);font-size:12.5px}
.fmeta span{border-radius:999px;padding:0 8px;background:rgba(255,255,255,.75)}
.fmeta .fl{color:var(--red)}
.fnote .stamp{position:absolute;right:-12px;bottom:-14px;background:rgba(255,255,255,.85)}
.hub{position:relative;font-family:var(--display);font-size:calc(17px + var(--hs,0) * 9px);line-height:1.2;background:var(--white);border:3px solid var(--ink);border-radius:18px;padding:8px 12px;box-shadow:0 5px 0 var(--mint-d);display:flex;flex-direction:column;align-items:flex-start;min-width:0;overflow-wrap:anywhere}
.hub small{font-family:var(--body);font-size:12.5px;color:var(--muted)}
.bigq{display:flex;flex-direction:column;gap:10px;background:var(--lav);border:3px solid var(--ink);border-radius:24px;padding:18px 16px;box-shadow:0 7px 0 var(--lav-d)}
.bigq .bq{font-family:var(--display);font-size:22px;line-height:1.35}
.bigq .label{align-self:flex-start;font-size:14px;padding:4px 10px}
.fmore{font-family:var(--display);font-size:14px;color:var(--muted);background:rgba(255,255,255,.65);border-radius:999px;padding:2px 10px;align-self:center}
.fempty{font-size:14.5px;color:var(--muted)}
.flow-wrap .hide{visibility:hidden}
.flow-wrap.focus .fnode:not(.on){opacity:.2}
.fnode.on{outline:3px solid var(--red);outline-offset:3px}
.e{fill:none;stroke-linecap:round}
.e-j{stroke:#D93A33;stroke-width:2.4;opacity:.72}
.e-k{stroke:#3A2F4B;stroke-width:1.6;stroke-dasharray:3 6;opacity:.45}
.e-b{stroke:#E5A800;stroke-width:3.4;opacity:.85}
.e.hi{opacity:1;stroke-width:3.6}
.e.dim{opacity:.06}
.pin{fill:#D93A33;stroke:#3A2F4B;stroke-width:1.2}
.pin.dim{opacity:.1}
.flegend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14.5px;color:var(--muted);align-items:center}
.lg{display:inline-block;width:30px;height:0;border-top:3px solid #D93A33;vertical-align:middle;margin-right:6px}
.lg.k{border-top:2px dashed var(--ink)} .lg.b{border-top:4px solid #E5A800}
.ftools{gap:8px}
.flow-wrap.present .fq{font-size:20px}
.flow-wrap.present .bigq .bq{font-size:28px}
.spark-halo{fill:rgba(255,210,63,.32)} .spark-dot{fill:#FFD23F;stroke:#3A2F4B;stroke-width:2.5}
/* 질문 수사판의 움직임: 쪽지 꽂힘, 끈 그려짐, 대질문 빛 고리. 동작 줄이기 설정이면 모두 끈다(불빛은 스크립트에서 끈다) */
@media (prefers-reduced-motion:no-preference){
  .flow-wrap .fnode.pop{animation:pinIn .6s cubic-bezier(.2,1.5,.4,1) both}
  .flow-wrap .fhead.pop{animation:fadeUp .45s ease-out both}
  .flow-wrap .bigq.pop{animation:bigIn 1.6s cubic-bezier(.2,1.3,.4,1) both}
  .e.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:drawLine .85s ease-in-out forwards}
  .e.hi.draw{animation-duration:.7s}
  .e-k.draw{stroke-dasharray:3 6;stroke-dashoffset:0;animation:fadeIn .8s ease-out both}
  .pin.pop{animation:fadeIn .5s ease-out both}
  @keyframes pinIn{from{opacity:0;transform:translateY(-20px) scale(.8) rotate(-6deg)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}}
  @keyframes fadeIn{from{opacity:0}}
  @keyframes drawLine{to{stroke-dashoffset:0}}
  @keyframes bigIn{0%{opacity:0;transform:scale(.55)}55%{opacity:1;transform:scale(1.06);box-shadow:0 7px 0 var(--lav-d),0 0 0 0 rgba(124,98,219,.6)}100%{box-shadow:0 7px 0 var(--lav-d),0 0 0 36px rgba(124,98,219,0)}}
}
@container (min-width:1100px){.flow-cols{gap:56px}}
@container (max-width:1000px){
  .flow-cols{grid-template-columns:minmax(120px,1fr) minmax(230px,2.2fr) minmax(120px,1fr) minmax(130px,.9fr);gap:26px}
  .fq{font-size:16px} .fnote{padding:14px 9px 8px} .fby{font-size:12px}
  .bigq{padding:14px 12px} .bigq .bq{font-size:17px} .hub{font-size:calc(15px + var(--hs,0) * 5px);padding:6px 9px}
  .fhead b{font-size:17px} .fhead2,.lane{gap:16px;grid-template-columns:minmax(92px,.42fr) 1fr}
  .fhead2 .fhead small{display:none}
}
@container (max-width:760px){
  .flow-cols{grid-template-columns:1fr;gap:34px}
  .fhead2,.lane{grid-template-columns:1fr;gap:12px}
  .lane-notes .fnote{max-width:none}
}

<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#home"><span id="logo"></span><span>정보 <i>탐정단</i></span></a>

  </div>

</header>
<main id="app"></main>
<canvas id="confetti"></canvas>

<!-- 연결 설정. 없으면(파일로 바로 열 때) 연습 모드로 동작한다. 만드는 법: scripts/build.mjs, SUPABASE.md -->
<script src="config.js"></script>
<script>
/* ============ 데이터 저장소 ============
   연결 모드: config.js 에 Supabase 주소와 anon key 가 있으면, 학급 코드로 반 친구들의 결과를 모은다.
     · 내 입력은 먼저 이 기기(localStorage)에 저장하고, Sync 가 바뀐 항목만 골라 RPC 로 보낸다.
     · 반 친구들 결과는 Live 가 ud_class_summary(집계)로 불러온다. 교사 화면은 Teacher 가 ud_teacher_data 로 불러온다.
   연습 모드: config.js 가 없으면 이 기기에만 저장하고, 반 친구들 결과는 예시 데이터로 보여 준다. */
const KEY='info-detective-v1';
const CFG=window.APP_CONFIG||null;
const ONLINE=!!(CFG&&CFG.supabaseUrl&&CFG.supabaseAnonKey);
const SUPA_JS='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
const QR_JS='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
const uuid=()=>{if(window.crypto&&crypto.randomUUID)try{return crypto.randomUUID()}catch(e){}
  const b=crypto.getRandomValues(new Uint8Array(16));b[6]=b[6]&15|64;b[8]=b[8]&63|128;const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20)};
const blank=()=>({cid:uuid(),me:{name:'',group:'',code:'',joined:'',cls:''},m1:{cards:{},vote:'',reason:'',newq:''},m2:{posts:{},pledge:{a:'',b:'',c:''},newq:''},
  m3:{kw:{1:'',2:'',3:'',4:''},words:[],sents:{},mode:'word',checked:false,sum:''},
  m4:{sort:{},kw:'',q:{1:'',2:'',3:'',4:''},posted:false,newq:'',wish:'',likes:[],answers:{}},sync:{}});
const Store={
  load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.me){const b=blank(),o=Object.assign(b,s);o.me=Object.assign(blank().me,s.me);o.sync=o.sync||{};o.cid=o.cid||b.cid;return o}}catch(e){}return blank()},
  save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
};
let S=Store.load();
const N=24; // 예시 학급 인원
// QR 로 들어오면 주소의 ?class=코드 가 학급 코드 칸을 채운다
(()=>{const q=new URLSearchParams(location.search).get('class');if(q){const c=q.trim().toUpperCase().slice(0,20);if(c&&c!==S.me.code){S.me.code=c;S.me.joined=''}Store.save()}})();

function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}

/* Supabase RPC 호출. 테이블은 RLS 로 막혀 있고 모든 읽기·쓰기는 supabase/schema.sql 의 함수로만 한다. */
const Net={
 async rpc(fn,args){
  const key=CFG.supabaseAnonKey,h={'Content-Type':'application/json',apikey:key};
  if(/^eyJ/.test(key))h.Authorization='Bearer '+key; // 예전 anon key(JWT)일 때만. 새 publishable key 는 apikey 머리글만 쓴다.
  const r=await fetch(CFG.supabaseUrl.replace(/\/+$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(args)});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok)throw new Error((j&&j.message)||('HTTP '+r.status));return j},
 show(s){const el=document.getElementById('net');if(!el)return;el.className='net '+s;el.textContent={saving:'저장 중…',ok:'저장됨',off:'연결이 끊겼어요'}[s]||''}
};

/* 실시간: 누군가 저장하면 같은 학급 채널에 "바뀜" 신호를 보내고, 받은 기기는 집계를 다시 불러온다.
   실시간이 안 되는 환경에서도 Poll 이 주기적으로 다시 불러온다. */
const RT={sb:null,ch:null,code:'',
 async connect(code){if(!ONLINE||CFG.realtime===false||!code||this.code===code)return;this.code=code;
  try{if(!window.supabase)await loadScript(SUPA_JS);this.sb=this.sb||window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey);
   if(this.ch)this.sb.removeChannel(this.ch);
   this.ch=this.sb.channel('ud-class-'+code,{config:{broadcast:{self:false}}}).on('broadcast',{event:'changed'},()=>{Live.refresh();Teacher.refresh()}).subscribe()}catch(e){this.code=''}},
 ping(){try{this.ch&&this.ch.send({type:'broadcast',event:'changed',payload:{}})}catch(e){}}
};

/* 내 입력 → 서버. 항목마다 마지막으로 보낸 값을 기억해 두고 달라진 것만 보낸다. */
const Sync={t:null,busy:false,again:false,
 ready(){return ONLINE&&!!S.me.joined&&S.me.joined===S.me.code.trim().toUpperCase()&&!!S.me.name.trim()},
 items(){const o={},put=(m,item,v)=>{o[m+':'+item]={m,item,value:v}},txt=v=>v&&String(v).trim()?{text:String(v).trim()}:null;
  put(0,'progress',{1:done[1](),2:done[2](),3:done[3](),4:done[4]()});
  put(1,'cards',Object.keys(S.m1.cards).length?S.m1.cards:null);
  put(1,'vote',S.m1.vote?{v:S.m1.vote,reason:S.m1.reason.trim()}:null);
  put(1,'newq',txt(S.m1.newq));
  put(2,'posts',Object.keys(S.m2.posts).length?Object.fromEntries(Object.entries(S.m2.posts).map(([k,p])=>[k,{verdict:p.verdict==null?null:p.verdict,c:p.c||{},found:!!p.found}])):null);
  const pl=S.m2.pledge;put(2,'pledge',(pl.a+pl.b+pl.c).trim()?{a:pl.a.trim(),b:pl.b.trim(),c:pl.c.trim()}:null);
  put(2,'newq',txt(S.m2.newq));
  put(3,'kw',[1,2,3,4].some(i=>S.m3.kw[i].trim())?{1:S.m3.kw[1],2:S.m3.kw[2],3:S.m3.kw[3],4:S.m3.kw[4]}:null);
  put(3,'practice',S.m3.checked?m3score():null);
  put(3,'sum',txt(S.m3.sum));
  put(4,'sort',Object.keys(S.m4.sort).length?S.m4.sort:null);
  [1,2,3,4].forEach(t=>put(4,'q'+t,S.m4.posted&&S.m4.q[t].trim()?{kw:S.m4.kw,t,text:S.m4.q[t].trim()}:null));
  put(4,'newq',txt(S.m4.newq));put(4,'wish',txt(S.m4.wish));
  return o},
 schedule(ms){if(!this.ready())return;clearTimeout(this.t);this.t=setTimeout(()=>this.flush(),ms==null?1200:ms)},
 async flush(){if(!this.ready())return;if(this.busy){this.again=true;return}this.busy=true;
  const code=S.me.joined,sent=S.sync[code]=S.sync[code]||{};let changed=false,err=false;
  for(const [k,x] of Object.entries(this.items())){
   const sig=x.value==null?null:JSON.stringify([S.me.group.trim(),S.me.name.trim(),x.value]);
   if(sig===sent[k]||(sig===null&&!(k in sent)))continue;
   if(!changed)Net.show('saving');
   try{if(sig===null){await Net.rpc('ud_remove_response',{p_code:code,p_client:S.cid,p_mission:x.m,p_item:x.item});delete sent[k]}
    else{await Net.rpc('ud_submit_response',{p_code:code,p_client:S.cid,p_group:S.me.group.trim(),p_nick:S.me.name.trim(),p_mission:x.m,p_item:x.item,p_value:x.value});sent[k]=sig}
    changed=true}
   catch(e){err=true;if(/unknown class/.test(e.message)){S.me.joined='';Entry.msg='학급 코드를 찾을 수 없어요. 선생님께 다시 여쭤보세요.';softRender()}break}}
  Store.save();this.busy=false;
  if(err)Net.show('off');else if(changed)Net.show('ok');
  if(changed){RT.ping();Live.refresh()}
  if(this.again||err){this.again=false;this.schedule(err?8000:300)}}
};

/* 반 친구들 결과(집계)를 불러온다 */
const Live={sum:null,last:0,rt:null,
 async refresh(force){const code=S.me.joined;if(!ONLINE||!code)return;
  const now=Date.now();if(!force&&now-this.last<2500){clearTimeout(this.rt);this.rt=setTimeout(()=>this.refresh(true),2500-(now-this.last));return}this.last=now;
  try{const s=await Net.rpc('ud_class_summary',{p_code:code,p_client:S.cid});
   if(s&&s.ok){if(s.code===S.me.joined){this.sum=s;softRender()}}else{S.me.joined='';Store.save();softRender()}}
  catch(e){Net.show('off')}}
};

/* 학급 코드 입장 */
const Entry={msg:'',busy:false};

/* 선생님 화면: 학급 코드 + PIN 으로 원문까지 불러온다. PIN 은 탭을 닫으면 사라지는 sessionStorage 에만 둔다. */
const TKEY='info-detective-teacher';
const Teacher={data:null,code:'',pin:'',msg:'',
 init(){try{const t=JSON.parse(sessionStorage.getItem(TKEY));if(t&&t.code){this.code=t.code;this.pin=t.pin}}catch(e){}},
 async login(code,pin){code=String(code||'').trim().toUpperCase();this.msg='';
  try{const d=await Net.rpc('ud_teacher_data',{p_code:code,p_pin:pin});
   if(d&&d.ok){this.code=code;this.pin=pin;this.data=d;try{sessionStorage.setItem(TKEY,JSON.stringify({code,pin}))}catch(e){}RT.connect(code)}
   else this.msg='학급 코드나 PIN 이 맞지 않습니다.'}
  catch(e){this.msg='서버에 연결하지 못했습니다. 잠시 뒤 다시 시도해 주세요.'}
  softRender()},
 async refresh(){if(!ONLINE||!this.pin)return;
  try{const d=await Net.rpc('ud_teacher_data',{p_code:this.code,p_pin:this.pin});if(d&&d.ok){this.data=d;softRender()}}catch(e){Net.show('off')}},
 logout(){this.data=null;this.pin='';this.code='';try{sessionStorage.removeItem(TKEY)}catch(e){}}
};
Teacher.init();

/* ============ 수업 내용 ============ */
const M1=[
 {id:'a',kind:'누리 소통망 게시물',src:'○○시청 공식 계정 · 2026년 7월 10일 오전 9시',txt:'오늘 낮 기온이 35도까지 올라 폭염 경보가 내려졌습니다. 야외 활동을 줄이고 물을 자주 마셔 주세요.',extra:'온도계 사진 1장 첨부',
  forms:['글자','사진'],who:'○○시청 공식 계정',whoOpt:['○○시청 공식 계정','우리 반 친구','알 수 없음'],when:'2026년 7월 10일',whenOpt:['2026년 7월 10일','작년 여름','알 수 없음'],known:true},
 {id:'b',kind:'단체 대화방 문자',src:'친구가 전달한 메시지 · 처음 쓴 사람과 날짜 표시 없음',txt:'야, 내일 태풍 때문에 전국 학교가 다 쉰대! 빨리 다른 방에도 퍼뜨려!',extra:'첨부 없음',
  forms:['글자'],who:'알 수 없음',whoOpt:['교육청','기상청','알 수 없음'],when:'알 수 없음',whenOpt:['오늘 아침','어제 저녁','알 수 없음'],known:false},
 {id:'c',kind:'영상',src:'○○과학관 공식 채널 · 2026년 6월 2일',txt:'「벼는 어떻게 자랄까?」 3분 영상. 연구원이 논에서 벼가 자라는 과정을 설명합니다.',extra:'해설 음성과 자막이 함께 나옴',
  forms:['영상','소리','글자'],who:'○○과학관 공식 채널',whoOpt:['○○과학관 공식 채널','이름 모를 개인 채널','알 수 없음'],when:'2026년 6월 2일',whenOpt:['2026년 6월 2일','10년 전','알 수 없음'],known:true}
];
const FORMS=['글자','사진','영상','소리'];
const VOTE_SEED={'양식':3,'출처':14,'내용':7};

const M2=[

function CD(){
 if(isLive()){const s=Live.sum;
  if(!s)return {live:true,loading:true,n:0,votes:{'양식':0,'출처':0,'내용':0},trust:{},kw:{},board:[],done:{1:0,2:0,3:0,4:0},groups:[],myAnswers:0};
  return {live:true,n:s.participants,votes:s.votes,trust:s.trust,kw:s.kw,done:s.done,groups:s.groups,myAnswers:s.my_answers,
   board:s.board.map(b=>({id:b.id,by:b.by,kw:b.kw,t:b.t,q:b.q,likes:b.likes,liked:b.liked,me:b.mine,ans:b.ans}))}}
 const mine=S.m4.posted?[1,2,3,4].filter(t=>S.m4.q[t].trim()).map(t=>({id:'me'+t,by:myName(),kw:S.m4.kw,t,q:S.m4.q[t],likes:0,liked:false,ans:[],me:true})):[];
 const sentAns=id=>{const a=S.m4.answers[id];return a&&a.sent&&a.text&&a.text.trim()?[{by:myName(),text:a.text.trim(),mine:true}]:[]};
 const kw={};[1,2,3,4].forEach(i=>{const m=Object.assign({},KW_SEED[i]);splitKw(S.m3.kw[i]).forEach(k=>m[k]=(m[k]||0)+1);kw[i]=m});
 return {live:false,n:N+(S.me.name?1:0),
  votes:Object.fromEntries(Object.entries(VOTE_SEED).map(([k,n])=>[k,n+(S.m1.vote===k?1:0)])),
  trust:Object.fromEntries(M2.map(p=>{const v=(S.m2.posts[p.id]||{}).verdict;return [p.id,{trusted:p.seed+(v===true?1:0),judged:N+(v!=null?1:0)}]})),
  kw,done:Object.fromEntries([1,2,3,4].map(n=>[n,DONE_SEED[n]+(done[n]()?1:0)])),groups:GROUP_SEED,
  myAnswers:BOARD.filter(b=>sentAns(b.id).length).length,
  board:mine.concat(BOARD.map(b=>{const liked=S.m4.likes.includes(b.id);return {...b,likes:b.likes+(liked?1:0),liked,ans:b.ans.map(t=>({by:'',text:t})).concat(sentAns(b.id))}}))}
}

/* ---- 선생님 화면 ---- */
const ITEM={progress:'해결 현황',cards:'정보 신분증',vote:'가장 중요한 것',newq:'새로운 질문',posts:'게시물 판정',pledge:'다짐 카드',kw:'핵심 낱말',
 practice:'사과 글 연습',sum:'중심 내용 정리',sort:'질문 분류',q1:'탐구 질문(1유형)',q2:'탐구 질문(2유형)',q3:'탐구 질문(3유형)',q4:'탐구 질문(4유형)',wish:'앱 건의'};
// 저장된 값 하나를 사람이 읽는 글로 (CSV, 표에 쓴다)
function itemText(item,v){if(v==null)return '';
 switch(item){
  case 'progress':{const s=[1,2,3,4].filter(n=>v[n]);return s.length?s.join('·')+'차시 해결':'아직 없음'}
  case 'cards':return M1.map((c,i)=>{const x=v[c.id]||{};return '사건'+(i+1)+' '+(x.checked?'확인':'미확인')+(x.what?' · '+x.what:'')}).join(' / ');
  case 'vote':return v.v+(v.reason?': '+v.reason:'');
  case 'posts':return M2.map((p,i)=>{const x=v[p.id]||{};return (i+1)+'번 '+(x.verdict===true?'믿을 만함':x.verdict===false?'확인 필요':'-')+(x.verdict!=null?(x.verdict===p.trust?'(맞음)':'(틀림)'):'')}).join(', ');
  case 'pledge':return [v.a&&'나는 디지털 정보를 받아들일 때 '+v.a+' 하겠습니다.',v.b&&'왜냐하면 '+v.b+' 때문입니다.',v.c].filter(Boolean).join(' ');
  case 'kw':return [1,2,3,4].map(i=>v[i]&&String(v[i]).trim()?i+'문단: '+v[i]:'').filter(Boolean).join(' / ');
  case 'practice':return '핵심 낱말 '+v.found+'/'+v.of+', 중심 문장 '+v.main+'/3';
  case 'sort':return SORT.filter(s=>v[s.id]===s.a).length+'/'+SORT.length+' 바르게 분류';
  default:if(/^q\d$/.test(item))return '['+v.kw+'] '+v.text;return v.text!=null?v.text:JSON.stringify(v)}}
const fmtTime=t=>t?new Date(t).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
const eul=w=>{const c=w.charCodeAt(w.length-1)-0xAC00;return c>=0&&c<11172&&c%28?'을':'를'}; // 받침 있으면 을, 없으면 를
const pct=t=>Math.round(t.trusted/Math.max(1,t.judged)*100)+'%';
const byGroup=(a,b)=>String(a.group||'').localeCompare(String(b.group||''),'ko',{numeric:true})||String(a.nick).localeCompare(String(b.nick),'ko');

/* 선생님 화면 자료. 연결 모드는 ud_teacher_data, 연습 모드는 예시 데이터 + 이 기기 입력 */
function TD(){
 if(ONLINE){const t=Teacher.data;if(!t)return null;const s=t.summary;
  const rows=t.rows.map(r=>({...r,who:r.group?r.group+'모둠 '+r.nick:r.nick}));
  const st={};rows.forEach(r=>{const x=st[r.client]=st[r.client]||{group:r.group,nick:r.nick,done:{},answers:0,at:r.at};if(r.item==='progress')x.done=r.value;if(r.at>x.at)x.at=r.at});
  t.answers.forEach(a=>{if(st[a.client])st[a.client].answers++});
  const qById=Object.fromEntries(s.board.map(b=>[b.id,b]));
  return {live:true,code:s.code,name:s.name,n:s.participants,done:s.done,votes:s.votes,trust:s.trust,groups:s.groups,board:s.board,
   students:Object.values(st).sort(byGroup),
   newqs:rows.filter(r=>r.item==='newq').map(r=>({by:r.who,q:r.value.text,m:r.mission})),
   wishes:rows.filter(r=>r.item==='wish').map(r=>({by:r.who,text:r.value.text})),
   reasons:rows.filter(r=>r.item==='vote').map(r=>({v:r.value.v,by:r.who,text:r.value.reason||''})),
   practice:rows.filter(r=>r.item==='practice').map(r=>r.value),
   csv:rows.slice().sort(byGroup).map(r=>[r.group,r.nick,String(r.mission||''),ITEM[r.item]||r.item,itemText(r.item,r.value),fmtTime(r.at)])
    .concat(t.answers.map(a=>{const q=qById[a.question];const w=(t.rows.find(r=>r.client===a.client)||{});return [w.group||'',w.nick||a.nick,'4','게시판 답'+(q?' → '+q.q:''),a.text,fmtTime(a.at)]}))}}
 const d=CD(),me=S.me.name?myName():'이 기기',items=Sync.items();
 return {live:false,n:d.n,done:d.done,votes:d.votes,trust:d.trust,groups:d.groups,board:d.board,students:[],
  newqs:[[S.m1.newq,1],[S.m2.newq,2],[S.m4.newq,4]].filter(x=>x[0].trim()).map(([q,m])=>({by:me,q,m})).concat(NEWQ_SEED),
  wishes:(S.m4.wish.trim()?[{by:me,text:S.m4.wish}]:[]).concat(WISH_SEED.map(t=>({by:'예시',text:t}))),
  reasons:S.m1.vote?[{v:S.m1.vote,by:me,text:S.m1.reason}]:[],
  practice:S.m3.checked?[m3score()]:[],
  csv:Object.values(items).filter(x=>x.value!=null&&x.item!=='progress').map(x=>[S.me.group,S.me.name||'이 기기',String(x.m||''),ITEM[x.item]||x.item,itemText(x.item,x.value),''])
   .concat(BOARD.map(b=>['','(예시) '+b.by,'4','탐구 질문('+b.t+'유형)',b.q,'']),NEWQ_SEED.map(q=>['','(예시) '+q.by,String(q.m),'새로운 질문',q.q,'']))}}

/* 지도 조언: 실제 숫자를 보고 그때그때 만든다 */
function advice(td){const a={};
 const vs=['양식','출처','내용'].map(k=>[k,td.votes[k]||0]),vt=vs.reduce((s,x)=>s+x[1],0);
 if(!vt)a[1]='아직 고른 학생이 없습니다.';
 else{const ns=vs.map(x=>x[1]),mx=Math.max(...ns),mn=Math.min(...ns);
  const tops=vs.filter(x=>x[1]===mx).map(x=>x[0]),lows=vs.filter(x=>x[1]===mn).map(x=>x[0]),q=w=>'「'+w+'」';
  a[1]=(tops.length>1?`${tops.map(q).join('·')} 모두 ${mx}명으로 같습니다. `:`가장 많이 고른 것은 ${q(tops[0])}(${mx}명)입니다. `)+
   (mx===mn?'의견이 고르게 나뉘었으니 서로의 까닭을 견주어 보게 하세요.'
   :mn===0?`${lows.map(q).join('·')}${eul(lows[lows.length-1])} 고른 학생은 없으니 「${lows[0]}만 보고 판단하면 어떤 일이 생길까?」 하고 물어 그 역할도 짚어 주세요.`
   :`가장 적게 고른 ${lows.map(q).join('·')}(${mn}명) 학생의 까닭부터 들으면 토의가 살아납니다.`)}
 const ps=M2.map((p,i)=>({i:i+1,p,t:td.trust[p.id]||{trusted:0,judged:0}})).filter(x=>x.t.judged);
 if(!ps.length)a[2]='아직 판정한 학생이 없습니다.';
 else{const r=x=>x.t.trusted/x.t.judged;
  const fooled=ps.filter(x=>!x.p.trust&&r(x)>=.25).sort((x,y)=>r(y)-r(x)),doubt=ps.filter(x=>x.p.trust&&r(x)<.6);
  a[2]=(fooled.length?fooled.map(x=>`${x.i}번(허위)은 ${pct(x.t)}가 믿었습니다`).join(', ')+'. 왜 믿게 되었는지부터 이야기하면 토의의 출발점이 됩니다.'
   :'허위 게시물을 믿은 학생은 적습니다.')+
   (doubt.length?` ${doubt.map(x=>x.i+'번').join('·')}은 사실인데 믿은 학생이 ${doubt.map(x=>pct(x.t)).join('·')}뿐입니다. 「무조건 의심」과 「확인하고 믿기」의 차이를 짚어 주세요.`:'')}
 const pr=td.practice;

/* ---- 질문 수사판: 학생들의 질문이 차시를 따라 이어진 흐름 (선생님 화면 + 발표 모드 #flow) ----
   단계: 1 출발한 궁금증(1·2차시 새로운 질문) → 2 핵심 낱말 → 3 탐구 질문(4차시) → 4 넓혀 간 질문(4차시 새로운 질문) → 5 대질문
   끈:   빨강 = 같은 학생의 질문 여정 / 점선 = 같은 핵심 낱말에서 나온 탐구 질문 / 노랑 = 대질문으로 모이는 질문
   쪽지는 HTML 로 배치하고, 끈은 그려진 쪽지 위치를 재어 SVG 곡선으로 잇는다(drawFlow). */
const FKEY='info-detective-flow';
const FlowUI={step:5,focus:null,tour:-1,anon:false,all:false,fit:true};
try{const p=JSON.parse(localStorage.getItem(FKEY));if(p){FlowUI.anon=!!p.anon;FlowUI.all=!!p.all;if(p.fit===false)FlowUI.fit=false}}catch(e){}
const saveFlowPrefs=()=>{try{localStorage.setItem(FKEY,JSON.stringify({anon:FlowUI.anon,all:FlowUI.all,fit:FlowUI.fit}))}catch(e){}};
const FSTEPS=[null,{name:'출발한 궁금증',sub:'1·2차시 새로운 질문'},{name:'핵심 낱말',sub:'3차시 · 질문의 재료'},{name:'탐구 질문',sub:'4차시'},
 {name:'넓혀 간 질문',sub:'4차시 새로운 질문'},{name:'대질문',sub:'교과서 27쪽'}];
const FORDER={n1:1,n2:2,t:3,n4:4}, FSTEP={n1:1,n2:1,t:3,n4:4}, FLIMIT=8;
const fwho=by=>{if(!FlowUI.anon)return by;const g=String(by||'').match(/^\d+모둠/);return (g?g[0]+' ':'')+'친구'};
const clip=(s,n)=>{s=String(s||'').trim();return s.length>n?s.slice(0,n-1)+'…':s};
let FLOW=null; // 마지막으로 그린 수사판 모델(끈 그리기에 쓴다)

function flowModel(td){
 const nodes=[];
 // 새로운 질문은 차시마다 학생당 하나라서 「차시+학생」을 id 로 쓴다(목록 순서가 바뀌어도 같은 쪽지로 알아본다)
 td.newqs.forEach((x,i)=>{const text=String(x.q||'').trim();if(!text)return;const kind=x.m==4?'n4':x.m==2?'n2':'n1';let id=kind+'_'+x.by;if(nodes.some(n=>n.id===id))id+='_'+i;nodes.push({id,kind,by:x.by,text})});
 td.board.forEach(b=>nodes.push({id:'t_'+b.id,kind:'t',by:b.by,text:b.q,kw:b.kw||'기타',t:b.t,likes:b.likes||0,ans:(b.ans||[]).length}));
 const st={};nodes.forEach(n=>{const s=st[n.by]=st[n.by]||{by:n.by,nodes:[],kinds:new Set(),likes:0};s.nodes.push(n);s.kinds.add(n.kind);s.likes+=n.likes||0});
 // 질문 여정이 긴(여러 단계에 질문을 남긴) 학생부터
 const students=Object.values(st).sort((a,b)=>b.kinds.size-a.kinds.size||b.likes-a.likes||b.nodes.length-a.nodes.length||String(a.by).localeCompare(String(b.by),'ko',{numeric:true}));
 const keep=new Set((FlowUI.all?students:students.slice(0,FLIMIT)).map(s=>s.by));
 const ts=nodes.filter(n=>n.kind==='t');
 const top=ts.filter(n=>n.likes>0).sort((a,b)=>b.likes-a.likes).slice(0,3);
 const shown=nodes.filter(n=>keep.has(n.by)||top.includes(n)),shownSet=new Set(shown);
 const kwCount={};ts.forEach(n=>kwCount[n.kw]=(kwCount[n.kw]||0)+1);
 const kws=Object.keys(kwCount).sort((a,b)=>kwCount[b]-kwCount[a]||a.localeCompare(b,'ko'));
 const edges=[];
 students.forEach(s=>{if(!keep.has(s.by))return;
  const groups=[1,2,3,4].map(o=>s.nodes.filter(n=>shownSet.has(n)&&FORDER[n.kind]===o)).filter(g=>g.length);
  for(let i=0;i+1<groups.length;i++)groups[i].forEach(a=>groups[i+1].forEach(b=>edges.push({a:a.id,b:b.id,k:'j'})))});
 shown.forEach(n=>{if(n.kind==='t')edges.push({a:'h_'+n.kw,b:n.id,k:'k'});if(n.kind==='n4')edges.push({a:n.id,b:'big',k:'b'})});
 const rank={};students.forEach((s,i)=>rank[s.by]=i);
 return {rank,nodes,shown,kws,kwCount,edges,best:top.length?top[0].id:null,hidden:nodes.length-shown.length,
  tour:students.filter(s=>keep.has(s.by)&&s.kinds.size>=2).map(s=>s.by),
  stat:{start:nodes.filter(n=>n.kind==='n1'||n.kind==='n2').length,t:ts.length,n4:nodes.filter(n=>n.kind==='n4').length,
   ans:ts.reduce((s,n)=>s+n.ans,0),likes:ts.reduce((s,n)=>s+n.likes,0),kw:kws.length,people:students.length}};
}
// 강조: 학생 하나(질문 여정) 또는 핵심 낱말 하나
function flowLit(fm){const f=FlowUI.focus;if(!f)return null;const on=new Set();
 if(f.k==='by')fm.shown.filter(n=>n.by===f.v).forEach(n=>{on.add(n.id);if(n.kind==='t')on.add('h_'+n.kw);if(n.kind==='n4')on.add('big')});
 else{on.add('h_'+f.v);fm.shown.filter(n=>n.kind==='t'&&n.kw===f.v).forEach(n=>on.add(n.id))}
 return on}
// 보기의 해설: 강조 중이면 그 흐름을, 발표 모드면 지금 단계를 설명한다
function flowSay(fm,present){const f=FlowUI.focus,s=fm.stat;
 if(f&&f.k==='by'){const mine=k=>fm.nodes.filter(n=>n.by===f.v&&n.kind===k),q=(n,len)=>'「'+esc(clip(n.text,len))+'」',bits=[];
  if(mine('n1').length)bits.push('1차시 '+q(mine('n1')[0],22));
  if(mine('n2').length)bits.push('2차시 '+q(mine('n2')[0],22));
  const t=mine('t');if(t.length)bits.push(`탐구 질문 ${t.length}개 ${q(t[0],20)}${t.length>1?' 등':''}`);
  if(mine('n4').length)bits.push('새로운 질문 '+q(mine('n4')[0],24));
  return say('wow',`<b>${esc(fwho(f.v))}</b>의 질문 여정: ${bits.join(' → ')}`,'good')}
 if(f){const t=fm.nodes.filter(n=>n.kind==='t'&&n.kw===f.v),ty=[1,2,3,4].filter(x=>t.some(n=>n.t===x));
  return say('think',`핵심 낱말 <b>「${esc(f.v)}」</b>에서 탐구 질문 ${t.length}개가 나왔어.${ty.length?' '+ty.map(x=>x+'유형').join('·')+' 질문이 있어.':''}`)}
 if(!present)return '';
 return say(FlowUI.step===5?'wow':'smile',{
  1:`1·2차시에 정보를 확인하면서 첫 궁금증 <b>${s.start}개</b>가 생겼어. 질문은 여기서 출발해.`,
  2:`3차시에는 글에서 <b>핵심 낱말</b>을 찾았어. 핵심 낱말은 질문의 재료야. 우리 반은 낱말 <b>${s.kw}개</b>로 질문을 만들었어.`,
  3:`4차시에 핵심 낱말로 <b>탐구 질문 ${s.t}개</b>를 만들고, 친구 질문에 답 <b>${s.ans}개</b>와 좋은 질문 도장 <b>${s.likes}개</b>를 주고받았어.`,

/* 움직임(질문 수사판에만 허용한 예외. 학생 화면은 여전히 흔들림·도장·색종이 세 가지만):
   새로 나타난 쪽지는 꽂히고, 새 끈은 그려지고, 강조한 학생의 여정에는 불빛이 흐른다.
   이미 본 것은 다시 움직이지 않도록 처음 나타난 시각을 기억한다(FlowAnim.born).
   새로 고침으로 다시 그려도 남은 만큼만 이어서 움직인다. 기기에서 「동작 줄이기」를 켜면 모두 끈다. */
const FlowAnim={born:{},fkey:''};
const motionOK=()=>!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
// key 가 처음 보이면 (지금+delay)에 시작한 것으로 적어 두고, 아직 움직이는 중이면 animation-delay(ms, 음수면 이미 진행 중)를 돌려준다
function animAt(key,delay,dur){if(!motionOK())return null;const now=performance.now();
 if(FlowAnim.born[key]==null)FlowAnim.born[key]=now+delay;const el=now-FlowAnim.born[key];return el<dur?Math.round(-el):null}

function flowMap(td,present){
 const fm=FLOW=flowModel(td),on=flowLit(fm),step=present?FlowUI.step:5;
 const vis=s=>s<=step?'':' hide',lit=id=>on&&on.has(id)?' on':'';
 let order=0; // 이번에 새로 나타나는 것들의 순서(왼쪽 칸부터 0.07초씩 늦게)
 const pop=(key,visible,dur)=>{if(!visible){delete FlowAnim.born[key];return ['','']}
  const d=animAt(key,FlowAnim.born[key]==null?Math.min(1200,order++*70):0,dur);return d==null?['','']:[' pop','animation-delay:'+d+'ms;']};
 const note=n=>{const a=pop('n:'+n.id,FSTEP[n.kind]<=step,700);return `<button type="button" class="fnode fnote k-${n.kind}${vis(FSTEP[n.kind])}${lit(n.id)}${a[0]}" style="${a[1]}" data-fid="${esc(n.id)}" data-act="flowfocus" data-k="by" data-v="${esc(n.by)}">
   ${n.kind==='t'?`<span class="ftag">${n.t}유형</span>`:n.kind==='n4'?'':`<span class="ftag">${n.kind==='n1'?1:2}차시</span>`}
   <span class="fq">${esc(clip(n.text,70))}</span><span class="fby">${esc(fwho(n.by))}${n.kind==='t'?` · 「${esc(n.kw)}」`:''}</span>
   ${n.kind==='t'&&(n.likes||n.ans)?`<span class="fmeta">${n.likes?`<span class="fl">도장 ${n.likes}</span>`:''}${n.ans?`<span>답 ${n.ans}</span>`:''}</span>`:''}
   ${n.id===fm.best?stamp('인기','질문',false,true):''}</button>`};
 const head=(s,count)=>{const a=pop('hd:'+s,s<=step,500);return `<div class="fhead${vis(s)}${a[0]}" style="${a[1]}"><span class="fstep">${s}</span><span><b>${FSTEPS[s].name}</b><small>${FSTEPS[s].sub}${count!=null?' · '+count+'개':''}</small></span></div>`};
 const empty=(s,t)=>`<p class="fempty${vis(s)}">${t}</p>`;
 const byRank=(a,b)=>(fm.rank[a.by]-fm.rank[b.by])||(FORDER[a.kind]-FORDER[b.kind]);
 const col1=fm.shown.filter(n=>n.kind==='n1'||n.kind==='n2').sort(byRank),col3=fm.shown.filter(n=>n.kind==='n4').sort(byRank);
 const c1=head(1,fm.stat.start)+(col1.length?`<div class="fstack">${col1.map(note).join('')}</div>`:empty(1,'아직 새로운 질문이 없어요.'));
 const c2h=`<div class="fhead2">${head(2,fm.stat.kw)}${head(3,fm.stat.t)}</div>`;
 const lanes=fm.kws.map(k=>{const ns=fm.shown.filter(n=>n.kind==='t'&&n.kw===k).sort(byRank),more=fm.kwCount[k]-ns.length,a=pop('n:h_'+k,2<=step,700);
  return `<div class="lane"><button type="button" class="fnode hub${vis(2)}${lit('h_'+k)}${a[0]}" data-fid="h_${esc(k)}" data-act="flowfocus" data-k="kw" data-v="${esc(k)}" style="--hs:${Math.min(1,fm.kwCount[k]/8).toFixed(2)};${a[1]}">${esc(k)}<small>탐구 질문 ${fm.kwCount[k]}개</small></button>
   <div class="lane-notes">${ns.map(note).join('')}${more>0?`<span class="fmore${vis(3)}">+${more}개</span>`:''}</div></div>`}).join('');
 const c3=head(4,fm.stat.n4)+(col3.length?`<div class="fstack">${col3.map(note).join('')}</div>`:empty(4,'아직 새로운 질문이 없어요.'));

  <svg class="flow-svg" id="flow-svg" aria-hidden="true"></svg>
  <div class="flow-cols">

   <section class="fcol" data-col="2">${c2h}${lanes||empty(2,'아직 붙은 탐구 질문이 없어요.')}</section>

     <span class="label">대질문</span><span class="bq">${BIGQ}</span><span class="fby">새로운 질문 ${fm.stat.n4}개가 이곳으로 모여요</span></button></section>
  </div></div>

const flowLegend=`<div class="flegend"><span><i class="lg"></i>같은 학생의 질문 여정</span><span><i class="lg k"></i>같은 핵심 낱말에서 나온 탐구 질문</span><span><i class="lg b"></i>대질문으로 모이는 질문</span><span>쪽지나 낱말을 누르면 그 흐름만 밝아져요</span></div>`;
const flowTools=present=>`<div class="row ftools">
 ${present?'':'<a class="btn small" href="#flow" data-act="gopresent">발표 모드로 크게 보기</a>'}

// 끈 그리기: 쪽지가 화면에 놓인 자리를 재서 곡선으로 잇는다. 크기가 바뀌면 다시 그린다.
function drawFlow(){
 const wrap=document.getElementById('flow'),svg=document.getElementById('flow-svg');if(!wrap||!svg||!FLOW)return;
 const W=wrap.getBoundingClientRect(),cache={},ow=wrap.offsetWidth,oh=wrap.offsetHeight,z=ow?W.width/ow:1;
 svg.setAttribute('width',ow);svg.setAttribute('height',oh);svg.setAttribute('viewBox','0 0 '+ow+' '+oh);
 const box=id=>{if(id in cache)return cache[id];const e=wrap.querySelector('[data-fid="'+CSS.escape(id)+'"]');
  if(!e||e.classList.contains('hide'))return cache[id]=null;
  const r=e.getBoundingClientRect(),c=e.closest('[data-col]');
  const X=x=>(x-W.left)/z,Y=y=>(y-W.top)/z;
  return cache[id]={l:X(r.left),r:X(r.right),t:Y(r.top),b:Y(r.bottom),cx:X((r.left+r.right)/2),cy:Y((r.top+r.bottom)/2),col:c&&c.dataset.col,on:e.classList.contains('on')}};
 const focus=wrap.classList.contains('focus'),f=FlowUI.focus,fkey=f?f.k+':'+f.v:'',mo=motionOK(),now=performance.now();
 if(FlowAnim.fkey!==fkey){Object.keys(FlowAnim.born).forEach(k=>{if(k.slice(0,2)==='f:')delete FlowAnim.born[k]});FlowAnim.fkey=fkey} // 강조가 바뀌면 강조 끈을 새로 그린다
 const layer={k:[],b:[],j:[],hi:[]};let ei=0,hi=0,hiEnd=0;
 FLOW.edges.forEach(e=>{const key='e:'+e.a+'>'+e.b,a=box(e.a),b=box(e.b);if(!a||!b){delete FlowAnim.born[key];return}
  const p=flowGeo(a,b),st=focus?(a.on&&b.on?' hi':' dim'):'';let d=null;
  if(mo){
   if(st===' hi'){if(FlowAnim.born[key]==null)FlowAnim.born[key]=now-1e4; // 강조된 채 처음 보인 끈은 일반 그리기를 건너뛴다
    const k2='f:'+fkey+':'+key;d=animAt(k2,FlowAnim.born[k2]==null?Math.min(2400,hi++*280):0,700);if(d!=null)hiEnd=Math.max(hiEnd,d+700)}  // 여정 순서대로 하나씩
   else d=animAt(key,FlowAnim.born[key]==null?350+Math.min(1200,ei++*35):0,850); // 쪽지가 꽂힌 뒤 끈이 이어진다
  }
  const dr=d!=null,sty=dr?` style="animation-delay:${d}ms"`:'';
  const svgp=`<path class="e e-${e.k}${st}${dr?' draw':''}"${dr&&e.k!=='k'?' pathLength="1"':''}${sty} d="${p[0]}"/>`+
   (e.k==='j'?p.slice(1).map(([x,y])=>`<circle class="pin${st===' dim'?' dim':''}${dr?' pop':''}"${sty} cx="${x}" cy="${y}" r="3.6"/>`).join(''):'');
  (st===' hi'?layer.hi:layer[e.k]).push(svgp)});
 // 여정 불빛: 강조한 학생의 첫 질문에서 대질문까지 끈을 따라 노란 불빛이 흐른다
 let spark='';
 if(mo&&f&&f.k==='by'){const mine=FLOW.shown.filter(n=>n.by===f.v);
  const ids=[1,2,3,4].map(o=>mine.find(n=>FORDER[n.kind]===o)).filter(Boolean).map(n=>n.id);if(mine.some(n=>n.kind==='n4'))ids.push('big');
  const segs=[];for(let i=0;i+1<ids.length;i++){const a=box(ids[i]),b=box(ids[i+1]);if(a&&b)segs.push(flowGeo(a,b)[0])}
  if(segs.length)spark=`<g class="spark" opacity="0"><circle class="spark-halo" r="22"/><circle class="spark-halo" r="13"/><circle class="spark-dot" r="8"/><animateMotion dur="${(1.3*segs.length).toFixed(1)}s" repeatCount="indefinite" begin="indefinite" path="${segs.join(' ')}"/></g>`}
 svg.innerHTML=layer.k.join('')+layer.b.join('')+layer.j.join('')+layer.hi.join('')+spark;
 const sp=svg.querySelector('.spark');
 if(sp)setTimeout(()=>{if(!sp.isConnected)return;sp.setAttribute('opacity','1');try{sp.querySelector('animateMotion').beginElement()}catch(e){}},Math.max(0,hiEnd));
}
// 두 쪽지를 잇는 곡선(a 에서 b 쪽으로). [경로, 시작점, 끝점]
function flowGeo(a,b){
 const h=(x1,y1,x2,y2)=>{const g=x2>=x1?1:-1,dx=Math.max(24,Math.abs(x2-x1)*.5);return [`M${x1} ${y1}C${x1+g*dx} ${y1} ${x2-g*dx} ${y2} ${x2} ${y2}`,[x1,y1],[x2,y2]]};
 if(b.l>=a.r-2)return h(a.r,a.cy,b.l,b.cy);       // 오른쪽으로
 if(a.l>=b.r-2)return h(a.l,a.cy,b.r,b.cy);       // 왼쪽으로
 if(a.col===b.col){const x=Math.min(a.l,b.l)-34;return [`M${a.l} ${a.cy}C${x} ${a.cy} ${x} ${b.cy} ${b.l} ${b.cy}`,[a.l,a.cy],[b.l,b.cy]]} // 같은 칸: 왼쪽으로 휘어 잇기
 if(b.t>=a.b-2){const dy=Math.max(24,(b.t-a.b)*.5);return [`M${a.cx} ${a.b}C${a.cx} ${a.b+dy} ${b.cx} ${b.t-dy} ${b.cx} ${b.t}`,[a.cx,a.b],[b.cx,b.t]]} // 좁은 화면: 아래로
 const dy=Math.max(24,(a.t-b.b)*.5);return [`M${a.cx} ${a.t}C${a.cx} ${a.t-dy} ${b.cx} ${b.b+dy} ${b.cx} ${b.b}`,[a.cx,a.t],[b.cx,b.b]]}
// 발표 모드 「한 화면에 맞추기」: 수사판을 조금 넓게 펼쳐 놓고(쪽지가 옆으로 더 들어가 높이가 줄어든다) 화면 높이에 맞게 줄인다.
// 글씨가 읽히도록 60% 밑으로는 줄이지 않는다(학생이 많으면 조금 스크롤된다).
function fitFlow(){const fit=document.getElementById('flowfit'),w=document.getElementById('flow');if(!fit||!w)return;
 w.style.transform='';w.style.width='';w.style.marginLeft='';fit.style.height='';if(!FlowUI.fit||fit.clientWidth<700)return; // 휴대폰처럼 좁으면 맞추지 않고 세로로 쌓는다
 const MAXW=1.5,MINS=.6,cw=fit.clientWidth,top=fit.getBoundingClientRect().top+window.scrollY,avail=Math.max(320,window.innerHeight-top-16);
 const lw=s=>Math.min(cw*MAXW,cw/s);let s=1;
 for(let i=0;i<5;i++){w.style.width=lw(s)+'px';const ns=Math.max(MINS,Math.min(1,avail/w.offsetHeight));if(Math.abs(ns-s)<.01){s=ns;break}s=ns}
 const W0=lw(s);w.style.width=W0+'px';const sf=Math.max(MINS,Math.min(1,avail/w.offsetHeight,cw/W0));
 if(sf>=1){w.style.width='';return}
 w.style.transformOrigin='top left';w.style.transform='scale('+sf+')';fit.style.height=Math.ceil(w.offsetHeight*sf)+'px';
 w.style.marginLeft=Math.max(0,(cw-w.offsetWidth*sf)/2)+'px'}
const flowRO=window.ResizeObserver?new ResizeObserver(()=>drawFlow()):null;
function mountFlow(){const w=document.getElementById('flow');if(!w)return;fitFlow();drawFlow();
 if(flowRO){flowRO.disconnect();flowRO.observe(w)}else requestAnimationFrame(drawFlow)}
let flowRz=0;window.addEventListener('resize',()=>{cancelAnimationFrame(flowRz);flowRz=requestAnimationFrame(()=>{fitFlow();drawFlow()})});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{fitFlow();drawFlow()});

/* 사건 해결 축하 색종이 */
function confetti(){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const cv=document.getElementById('confetti'),x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
 const cols=['#FFD23F','#F26B4E','#3F9BDD','#1F9E6C','#7C62DB'];
 const ps=Array.from({length:90},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:6+Math.random()*8,r:Math.random()*6,c:cols[Math.random()*5|0]}));
 let n=0;(function tick(){x.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.r+=.12;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);x.restore()});
  if(++n<150)requestAnimationFrame(tick);else x.clearRect(0,0,cv.width,cv.height)})();
}

 m1check(d){card(d.c).checked=true},
 m1vote(d){S.m1.vote=d.v},
 m2find(d){post(d.p).found=true},
 m2chk(d){post(d.p).c[d.j]=d.v==='1'},
 m2ver(d){post(d.p).verdict=d.v==='1'},
 m3mode(d){S.m3.mode=d.v},
 m3word(d){if(S.m3.mode!=='word')return false;const i=S.m3.words.indexOf(d.id);i<0?S.m3.words.push(d.id):S.m3.words.splice(i,1);S.m3.checked=false},
 m3sent(d){if(S.m3.mode!=='sent')return false;S.m3.sents[d.p]=S.m3.sents[d.p]===+d.s?null:+d.s;S.m3.checked=false},
 m3check(){S.m3.checked=true},
 m3clear(){S.m3.words=[];S.m3.sents={};S.m3.checked=false},
 m3conn(d){S.m3.sum=(S.m3.sum?S.m3.sum.replace(/\s*$/,' '):'')+d.v+' '},
 m4sort(d){S.m4.sort[d.s]=d.v},
 m4kw(d){S.m4.kw=d.v},
 m4post(){if([1,2,3,4].some(t=>S.m4.q[t].trim()))S.m4.posted=true},
 m4like(d){
  if(!isLive()){const i=S.m4.likes.indexOf(d.b);i<0?S.m4.likes.push(d.b):S.m4.likes.splice(i,1);return}
  if(!Sync.ready())return false;
  const b=liveBoard(d.b);if(b){b.liked=!b.liked;b.likes+=b.liked?1:-1}
  Net.rpc('ud_toggle_like',{p_code:S.me.joined,p_client:S.cid,p_nick:myName(),p_question:d.b}).then(()=>{RT.ping();Live.refresh(true)},()=>{Net.show('off');Live.refresh(true)})},
 m4ans(d){const a=S.m4.answers[d.b];if(!a||!a.text||!a.text.trim())return false;
  if(!isLive()){a.sent=true;return}
  if(!Sync.ready())return false;
  const text=a.text.trim(),b=liveBoard(d.b);if(b){b.ans=b.ans.filter(x=>!x.mine).concat([{by:myName(),text,mine:true}]);Live.sum.my_answers=Live.sum.board.filter(x=>x.ans.some(y=>y.mine)).length}
  a.sent=true;a.text='';Net.show('saving');
  Net.rpc('ud_submit_answer',{p_code:S.me.joined,p_client:S.cid,p_nick:myName(),p_question:d.b,p_text:text}).then(()=>{Net.show('ok');RT.ping();Live.refresh(true)},()=>{Net.show('off');Live.refresh(true)})},
 tlogin(){const c=document.getElementById('t-code'),p=document.getElementById('t-pin');if(!c.value.trim()||!p.value){Teacher.msg='학급 코드와 PIN을 모두 넣어 주세요.';return}
  Teacher.login(c.value,p.value);return false},
 tlogout(){Teacher.logout()},
 // 질문 수사판
 flowfocus(d){const f=FlowUI.focus;FlowUI.focus=d.k==='none'||(f&&f.k===d.k&&f.v===d.v)?null:{k:d.k,v:d.v}},
 flowclear(){FlowUI.focus=null},
 flowtour(){const td=TD();if(!td)return false;const fm=flowModel(td);if(!fm.tour.length){FlowUI.focus=null;return}
  FlowUI.tour=(FlowUI.tour+1)%fm.tour.length;FlowUI.focus={k:'by',v:fm.tour[FlowUI.tour]};FlowUI.step=5},
 flownext(){if(FlowUI.step<5){FlowUI.step++;FlowUI.focus=null;if(FlowUI.step===5)confetti()}},
 flowprev(){if(FlowUI.step>1){FlowUI.step--;FlowUI.focus=null}},
 flowgo(d){const s=+d.v;if(s===5&&FlowUI.step<5)confetti();FlowUI.step=s;FlowUI.focus=null},
 flowanon(){FlowUI.anon=!FlowUI.anon;saveFlowPrefs()},
 flowall(){FlowUI.all=!FlowUI.all;saveFlowPrefs()},
 flowfit(){FlowUI.fit=!FlowUI.fit;saveFlowPrefs()},
 gopresent(){FlowUI.step=1;FlowUI.focus=null;return false}, // 주소가 #flow 로 바뀌며 다시 그린다
 flowfull(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}return false},
 trefresh(){Teacher.refresh();return false},
 download(){const td=TD();if(!td)return 'keep';
  const blob=new Blob(['﻿'+csvText(td)],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='정보탐정단_'+(td.live?td.code:'연습')+'_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  const msg=document.getElementById('copymsg');if(msg)msg.textContent='CSV 파일을 내려받았습니다.';return 'keep'},
 copy(){const td=TD();if(!td)return 'keep';const csv=csvText(td);const msg=document.getElementById('copymsg');const box=document.getElementById('csvbox');
  const fallback=()=>{box.hidden=false;box.value=csv;box.select();msg.textContent='아래 내용을 직접 복사해 스프레드시트에 붙여 넣으세요.'};
  try{navigator.clipboard.writeText(csv).then(()=>{msg.textContent='복사했습니다. 스프레드시트에 붙여 넣으세요.'},fallback)}catch(e){fallback()}
  return 'keep'}
};
document.addEventListener('click',e=>{
 // 낱말(.w)이 문장(.s) 안에 있으므로 모드에 맞는 쪽을 고른다
 let t=e.target.closest('[data-act]');if(!t)return;
 if(t.dataset.act==='m3word'&&S.m3.mode==='sent')t=t.parentElement.closest('[data-act]');
 if(!t||!A[t.dataset.act])return;
 const was=[1,2,3,4,5].map(n=>done[n]());
 const r=A[t.dataset.act](t.dataset,t);
 if(r instanceof Promise)return;
 if([1,2,3,4,5].some(n=>!was[n-1]&&done[n]()))confetti();
 if(r==='keep')return; Store.save(); Sync.schedule(300); if(r!==false){const y=window.scrollY;render();window.scrollTo(0,y)}
});
document.addEventListener('input',e=>{const p=e.target.dataset&&e.target.dataset.bind;if(!p)return;set(S,p,e.target.value);Store.save();Sync.schedule();
 if(p.startsWith('me.'))document.getElementById('who').textContent=whoText()});
// 입력 칸에서 Enter: 학급 코드·별명 → 입장, 선생님 PIN → 불러오기
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.isComposing)return;const id=e.target.id;
 if(ONLINE&&(id==='f-me-code'||id==='f-me-name'||id==='f-me-group')){e.preventDefault();e.target.blur();A.join()}
 else if(id==='t-pin'||id==='t-code'){e.preventDefault();A.tlogin();}});
// 발표 모드: → 스페이스 PageDown = 다음, ← PageUp = 이전, Esc = 강조 끄기 (프레젠터 리모컨은 PageDown/PageUp 을 보낸다)
document.addEventListener('keydown',e=>{if(route()!=='flow'||typing()||e.altKey||e.ctrlKey||e.metaKey||e.isComposing)return;
 const k=e.key,t=e.target;if((k===' '||k==='Enter')&&t.closest&&t.closest('button,a'))return; // 단추 위에서는 단추가 처리
 let act=null;if(k==='ArrowRight'||k==='PageDown'||k===' ')act='flownext';else if(k==='ArrowLeft'||k==='PageUp')act='flowprev';else if(k==='Escape'&&FlowUI.focus)act='flowclear';
 if(!act)return;e.preventDefault();A[act]();softRender()});

const whoText=()=>S.me.name?myName()+' 탐정'+(Sync.ready()?' · '+S.me.joined:''):'';
const ROUTES={'home':'home','mission-1':'m1','mission-2':'m2','mission-3':'m3','mission-4':'m4','teacher':'teacher','flow':'flow'};
const TC={home:'var(--white)',1:'var(--sky)',2:'var(--peach)',3:'var(--lemon)',4:'var(--mint)'};
const route=()=>ROUTES[(location.hash||'#home').slice(1)]||'home';
const isT=()=>route()==='teacher'||route()==='flow'; // 선생님 화면(교사 자료를 불러오는 화면)
function render(){
 const v=route();
 const app=document.getElementById('app');app.className={m1:'t1',m2:'t2',m3:'t3',m4:'t4',teacher:'t5',flow:'t5 wide'}[v]||'';
 document.body.classList.toggle('present',v==='flow');
 // 연결 모드인데 아직 입장하지 않았으면 사건 화면 위에 알려 준다
 const remind=ONLINE&&/^m\d$/.test(v)&&!Sync.ready()?`<section class="card" style="--c:var(--peach)">${say('think','아직 입장하지 않았어. 첫 화면에서 학급 코드, 모둠, 별명을 쓰고 「입장하기」를 누르면 내 기록이 반 친구들과 모여. <a href="#home">명찰 채우러 가기</a>','oops')}</section>`:'';
 app.innerHTML=remind+V[v]();
 document.getElementById('logo').innerHTML=mascot('smile',44);
 document.getElementById('who').textContent=whoText();
 document.getElementById('tabs').innerHTML=`<a class="tab" href="#home" ${v==='home'?'aria-current="page"':''}>사건 목록</a>`+
  [1,2,3,4].map(n=>`<a class="tab" style="--tc:${TC[n]}" href="#mission-${n}" ${v==='m'+n?'aria-current="page"':''}>${n}차시${done[n]()?STAR:''}</a>`).join('');
 if(v==='teacher')fillQR();
 if(v==='teacher'||v==='flow')mountFlow();
}
window.addEventListener('hashchange',()=>{if(isT())FlowAnim.born={};render();window.scrollTo(0,0);if(isT())Teacher.refresh();else Live.refresh()});

/* 시작: 연결 모드면 입장 상태를 확인하고, 실시간 채널에 붙고, 주기적으로 다시 불러온다 */
render();
if(ONLINE){
 if(S.me.joined){RT.connect(S.me.joined);Live.refresh(true);Sync.schedule(500)}
 else if(S.me.code&&S.me.name.trim())A.join(); // QR 로 다시 들어온 경우
 if(Teacher.pin){Teacher.refresh();RT.connect(Teacher.code)}
 setInterval(()=>{if(document.hidden)return;if(isT())Teacher.refresh();else Live.refresh()},CFG.pollMs||15000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden){Sync.schedule(0);isT()?Teacher.refresh():Live.refresh()}});
}
</script>
</body>
